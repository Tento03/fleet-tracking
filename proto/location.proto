syntax = "proto3";

package location;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Tento03/fleet-tracking/proto;locationpb";

// LocationService handles bidirectional real-time GPS streaming from drivers.
service LocationService {
  // StreamLocation receives a client-side stream of GPS data points
  // and yields a LocationAck stream acknowledging each event individually.
  rpc StreamLocation(stream LocationRequest) returns (stream LocationAck);
}

// LocationRequest carries a single GPS data point from a driver.
message LocationRequest {
  // Unique UUID v4 generated by client for idempotency/tracking.
  string event_id = 1;

  // Stable driver identifier / code (e.g. "driver-001").
  string driver_code = 2;

  // WGS-84 latitude in decimal degrees [-90, 90].
  double latitude = 3;

  // WGS-84 longitude in decimal degrees [-180, 180].
  double longitude = 4;

  // Current speed in km/h.
  float speed = 5;

  // Compass heading in degrees [0, 360), 0 = North, clockwise.
  float heading = 6;

  // Timestamp when GPS fix was recorded.
  google.protobuf.Timestamp timestamp = 7;
}

// LocationAck acknowledges receipt and processing result for a single LocationRequest.
message LocationAck {
  // Matches the event_id from the corresponding LocationRequest.
  string event_id = 1;

  // True if accepted and queued for Kafka, false if rejected / backpressure.
  bool accepted = 2;

  // Informative message or rejection reason.
  string message = 3;
}
